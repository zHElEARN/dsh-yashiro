# dsh-yashiro bundle patch
#
# 当本包通过 `dsh plugin --profile <name> add <path|pkg>` 安装后，dsh 启动时会
# 自动加载这层 patch，把插件挂进 profile 的 cordis 树。
#
# 叠加顺序：dsh-base → 本 bundle patch → profile 的 cordis.patch.yml → --patch
#
# 配置项说明见 README.md。appId / appSecret 必填。

- insert:
    - id: yashiro
      name: 'dsh-yashiro'
      config:
        # ↓↓↓ 这两个必填，改成你的机器人凭据 ↓↓↓
        appId: ''
        appSecret: ''
        # 沙箱环境（未上线的机器人）填 true
        sandbox: false
        # agent 的工作目录；留空用进程 cwd
        cwd: ''
        # 访问控制（fail closed）
        # allowedGroups 为空 = 一个群都不放行，必须显式列 group_openid 才会工作
        # 不知道群 id 时：在群里发 /id，插件会直接回复群 id（不经过 agent）
        allowedGroups: []
        # 单聊白名单（user openid），空 = 一个都不放行
        allowedUsers: []
        # 发送者黑名单（openid），只拦 @ 触发，不影响消息入库
        blockedSenders: []
        # 群历史库路径；留空 = $DSH_HOME/storages/dsh-yashiro/history.db
        historyDbPath: ''
        historyDefaultLimit: 30
        historyMaxLimit: 200
        sendChunkLimit: 4500
        announceNewMessageCount: true
        debug: false
